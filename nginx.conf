server {
    listen 80;
    server_name localhost;

    # 1. 代理 FastAPI 的文档与后端接口（方便面试官直接测试 API）
    location /docs {
        proxy_pass http://fastapi-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://fastapi-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. 核心：代理 Streamlit 前端（必须配置完整的 WebSocket 支持）
    location / {
        proxy_pass http://streamlit-frontend:8501;
        
        # 针对 Streamlit 底层通讯（WebSocket）的关键配置，否则网页会陷入无限 Connecting...
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递客户端真实 IP 与主机头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}